<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Opening host view…</title>
</head>
<body>
  <p>Opening the workshop host view… <a id="hostLink" href="index.html?view=host">Continue</a></p>
  <script>
    (function () {
      "use strict";
      var destination = new URL("/index.html", window.location.href);
      new URLSearchParams(window.location.search).forEach(function (value, key) {
        destination.searchParams.set(key, value);
      });
      destination.searchParams.set("view", "host");
      destination.hash = window.location.hash;
      document.getElementById("hostLink").href = destination.href;
      window.location.replace(destination.href);
    }());
  </script>
</body>
</html>
